[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wakemarch"
version = "0.1.0"
description = "Cross-plane marching wake model for yawed wind turbines with curled wakes"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "src/wakemarch/data/FLORIS_LICENSE.txt"]
authors = [{ name = "Hoang Hai Bui" }]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["wind energy", "wake model", "yaw", "wake steering", "curled wake"]

[project.urls]
Homepage = "https://github.com/haibuihoang/wakemarch"
Issues = "https://github.com/haibuihoang/wakemarch/issues"
Changelog = "https://github.com/haibuihoang/wakemarch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
notebooks = ["matplotlib>=3.8", "jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbconvert>=7"]
validation = ["h5py>=3.10", "netCDF4>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wakemarch*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
wakemarch = ["data/*.json", "data/*.txt"]
