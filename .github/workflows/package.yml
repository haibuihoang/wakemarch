name: WakeMarch package checks
on:
  push:
    paths: ['**']
  pull_request:
    paths: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        dependencies: [latest]
        include:
          - os: ubuntu-latest
            python: '3.11'
            dependencies: minimum
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install --upgrade pip 'setuptools>=77' wheel
      - name: Build and test installed distributions
        run: |
          PACKAGE_DIR=.
          if [ -f package/pyproject.toml ]; then PACKAGE_DIR=package; fi
          OPTIONS=()
          if [ '${{ matrix.dependencies }}' = minimum ]; then OPTIONS+=(--minimum); fi
          if [ '${{ matrix.os }}' = ubuntu-latest ] && [ '${{ matrix.python }}' = 3.11 ] && [ '${{ matrix.dependencies }}' = latest ]; then OPTIONS+=(--notebooks); fi
          python -I -B "$PACKAGE_DIR/tools/check_release.py" --output "$RUNNER_TEMP/wakemarch-check" "${OPTIONS[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.dependencies }}
          path: ${{ runner.temp }}/wakemarch-check
